{% load static %}
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dokumenty firmowe{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'dashboard' %}">Dokumenty<span>Firmowe</span></a>
    {% if request.user.is_authenticated %}
    <nav>
      <a href="{% url 'dashboard' %}">Pulpit</a>
      <a href="{% url 'document_list' %}">Dokumenty</a>
      <a href="{% url 'client_list' %}">Klienci</a>
      <a href="{% url 'template_list' %}">Szablony</a>
      <a href="/admin/">Administracja</a>
    </nav>
    <form method="post" action="{% url 'logout' %}" class="logout-form">
      {% csrf_token %}
      <button class="link-button" type="submit">Wyloguj: {{ request.user.username }}</button>
    </form>
    {% endif %}
  </header>
  <main class="container">
    {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
